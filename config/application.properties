site.url=https://xam.dk

# Reuse Jekyll data dir in place
quarkus.roq.data.dir=_data

# Qute: alt syntax so {..} in code samples is plain text
quarkus.qute.alt-expr-syntax=true
quarkus.qute.strict-rendering=false
quarkus.qute.property-not-found-strategy=NOOP

# Preserve original filenames in URLs
site.slugify-files=false

# Flexible date parsing for Jekyll's mixed formats
site.date-format=yyyy-MM-dd['T'HH:mm:ss][X]

# Posts collection: preserve Jekyll permalink /blog/<slug>/
site.collections.posts.layout=post
site.collections.posts.link=/blog/:name/

# AsciiDoc: Jekyll layouts render title separately
quarkus.asciidoc.attributes.notitle=true
quarkus.asciidoc.attributes.icons=font

# Don't let the CSS bundler resolve Jekyll-style /assets/* URLs
quarkus.web-bundler.bundling.external=/assets/*
