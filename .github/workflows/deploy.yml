name: publish-to-xam.dk

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: build-and-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: jbangdev/setup-jbang@main
      - name: Install Roq CLI
        run: jbang app install --fresh --force roq@quarkiverse/quarkus-roq
      - name: Generate static site
        run: roq generate
      - name: Deploy via rsync
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          XAMSSH: "${{ secrets.XAMSSH }}"
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq sshpass
          sshpass -p "$XAMSSH" rsync -rvc -e 'ssh -o StrictHostKeyChecking=no -p 22' \
            --delete --exclude coppermine --exclude update --stats \
            target/roq/ xam.dk@ssh.xam.dk:webroots/www/
