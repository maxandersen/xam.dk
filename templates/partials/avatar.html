{! Webmention author avatar: unavatar.io photo with an initials-circle fallback.
   Params: m (author object with photo?/color/initials/author), extra (css classes). !}
{#if m.photo}<img class="avatar{=extra} u-photo" src="{=m.photo}" alt="{=m.author}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span class="avatar initials{=extra}" style="background:{=m.color};display:none">{=m.initials}</span>{#else}<span class="avatar initials{=extra}" style="background:{=m.color}">{=m.initials}</span>{/if}
